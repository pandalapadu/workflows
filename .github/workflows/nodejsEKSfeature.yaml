name: NodeJS EKS Feature Workflow
on:
  workflow_call:
    inputs:
      project:
        required: true
        type: string
      component:
        required: true
        type: string
jobs:
  build-nodejs:
    runs-on: ubuntu-latest
    steps:
      - name: read version from input
        run: |
          echo "Project: ${{ inputs.project }}"
          echo "Component: ${{ inputs.component }}"


