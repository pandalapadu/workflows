name: NodeJS EKS Feature Workflow
on:
  workflow_call:
    inputs:
      project:
        required: true
        type: string
      component:
        required: true
        type: string
env:
  project: ${{ inputs.project }}
  component: ${{ inputs.component }}
jobs:
  build-nodejs:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v7 # this is plugin to checkout the code from the repository

      - name: list of files
        run: |
            ls -ltr
            pwd




